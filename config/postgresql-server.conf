# PostgreSQL settings for COL868 on a Linux server.
# Copy the numbers that match the machine into postgresql.conf, or
#   include_if_exists '/path/to/this/file'
# then restart Postgres. Autovacuum stays off. ANALYZE by hand once per schema.
#
# Pick shared_buffers so it is about 25% of RAM, and effective_cache_size about 75%.
# Then pick the TPC-DS scale so the heap is larger than RAM. If the heap fits in
# RAM, index benefits collapse to CPU/cache noise, which is what happened at SF=1
# on the laptop and will happen at SF=10 on a 128 GB box.
#
# Linux can use effective_io_concurrency > 0. The laptop had to set it to 0 (macOS).

# --- example: 64 GB RAM, SF=100 (heap will not fit) ---
shared_buffers = 16GB
effective_cache_size = 48GB
maintenance_work_mem = 2GB
work_mem = 256MB
max_parallel_workers_per_gather = 8
max_parallel_workers = 16
max_worker_processes = 16
random_page_cost = 1.1
effective_io_concurrency = 200
wal_buffers = 64MB
checkpoint_completion_target = 0.9
max_wal_size = 8GB
min_wal_size = 2GB
huge_pages = try
shared_preload_libraries = 'pg_stat_statements'
pg_stat_statements.track = all
pg_stat_statements.max = 10000
jit = on
autovacuum = off

