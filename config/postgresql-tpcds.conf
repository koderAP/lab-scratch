# PostgreSQL settings for TPC-DS iteration on a 16 GB Apple Silicon Mac.
# Apply with: include_if_exists in postgresql.conf, then restart.
# These override the Homebrew defaults (shared_buffers=128MB), which are
# too small for SF=10 analytical queries.

shared_buffers = 2GB
effective_cache_size = 8GB
maintenance_work_mem = 1GB
work_mem = 64MB
max_parallel_workers_per_gather = 4
max_parallel_workers = 8
max_worker_processes = 8
random_page_cost = 1.1
# macOS has no posix_fadvise; PostgreSQL requires 0 here.
effective_io_concurrency = 0
wal_buffers = 64MB
checkpoint_completion_target = 0.9
max_wal_size = 4GB
min_wal_size = 1GB
huge_pages = off
shared_preload_libraries = 'pg_stat_statements'
pg_stat_statements.track = all
pg_stat_statements.max = 10000
jit = on

# Experiments: autovacuum steals IO/cache and flips 2.3s vs 10s on the same plan. Run VACUUM (ANALYZE) manually once per DB.
autovacuum = off
